<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="AI-Native Trust Infrastructure — Digital Identity, Cryptographic Trust and Document Signing"
    >

    <meta
        name="theme-color"
        content="#080b12"
    >

    <title>
        AI-Native Trust Infrastructure
    </title>

    <link
        rel="stylesheet"
        href="/styles.css"
    >
</head>


<body>

    <div class="app-shell">


        <!-- ==================================================
             SIDEBAR
             ================================================== -->

        <aside
            class="sidebar"
            id="sidebar"
        >

            <div class="sidebar-header">

                <a
                    href="#"
                    class="brand"
                    data-action="go-dashboard"
                >

                    <div class="brand-mark">

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path
                                d="M12 3l7 3v5c0 4.8-3 8-7 10-4-2-7-5.2-7-10V6l7-3z"
                            ></path>

                            <path
                                d="M9 12l2 2 4-4"
                            ></path>
                        </svg>

                    </div>


                    <div class="brand-text">

                        <div class="brand-title">
                            AI-NATIVE TRUST
                        </div>

                        <div class="brand-subtitle">
                            Infrastructure
                        </div>

                    </div>

                </a>

            </div>


            <nav
                class="sidebar-nav"
                aria-label="Main navigation"
            >

                <div class="nav-label">
                    Workspace
                </div>


                <!-- Dashboard -->

                <a
                    href="#dashboard"
                    class="nav-item active"
                    data-view="dashboard"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <rect
                            x="4"
                            y="4"
                            width="6"
                            height="6"
                            rx="1"
                        ></rect>

                        <rect
                            x="14"
                            y="4"
                            width="6"
                            height="6"
                            rx="1"
                        ></rect>

                        <rect
                            x="4"
                            y="14"
                            width="6"
                            height="6"
                            rx="1"
                        ></rect>

                        <rect
                            x="14"
                            y="14"
                            width="6"
                            height="6"
                            rx="1"
                        ></rect>
                    </svg>

                    <span>
                        Dashboard
                    </span>

                </a>


                <!-- Digital Identities -->

                <a
                    href="#identities"
                    class="nav-item"
                    data-view="identities"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <circle
                            cx="12"
                            cy="8"
                            r="3"
                        ></circle>

                        <path
                            d="M5 20c.8-3.3 3.1-5 7-5s6.2 1.7 7 5"
                        ></path>
                    </svg>

                    <span>
                        Digital Identities
                    </span>

                </a>


                <!-- Sign Document -->

                <a
                    href="#sign"
                    class="nav-item"
                    data-view="sign"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path
                            d="M6 3h8l4 4v14H6z"
                        ></path>

                        <path
                            d="M14 3v5h5"
                        ></path>

                        <path
                            d="M9 15l2 2 4-4"
                        ></path>
                    </svg>

                    <span>
                        Sign Document
                    </span>

                </a>


                <!-- Verify Signature -->

                <a
                    href="#verify"
                    class="nav-item"
                    data-view="verify"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path
                            d="M12 3l7 3v5c0 4.8-3 8-7 10-4-2-7-5.2-7-10V6l7-3z"
                        ></path>

                        <path
                            d="M9 12l2 2 4-4"
                        ></path>
                    </svg>

                    <span>
                        Verify Signature
                    </span>

                </a>


                <!-- Trust Registry -->

                <a
                    href="#registry"
                    class="nav-item"
                    data-view="registry"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <circle
                            cx="6"
                            cy="12"
                            r="2"
                        ></circle>

                        <circle
                            cx="18"
                            cy="6"
                            r="2"
                        ></circle>

                        <circle
                            cx="18"
                            cy="18"
                            r="2"
                        ></circle>

                        <path
                            d="M8 11l8-4"
                        ></path>

                        <path
                            d="M8 13l8 4"
                        ></path>
                    </svg>

                    <span>
                        Trust Registry
                    </span>

                </a>

            </nav>


            <!-- Sidebar system status -->

            <div class="sidebar-footer">

                <div
                    class="sidebar-system"
                    data-api-status
                >

                    <span
                        class="status-dot offline"
                    ></span>

                    <span
                        data-api-status-text
                    >
                        Connecting…
                    </span>

                </div>

            </div>

        </aside>



        <!-- ==================================================
             MAIN AREA
             ================================================== -->

        <div class="main-area">


            <!-- ==================================================
                 TOP HEADER
                 ================================================== -->

            <header class="top-header">


                <div class="header-left">

                    <!-- Mobile menu -->

                    <button
                        type="button"
                        class="mobile-menu-button"
                        id="mobileMenuButton"
                        aria-label="Open navigation"
                    >

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path
                                d="M4 7h16"
                            ></path>

                            <path
                                d="M4 12h16"
                            ></path>

                            <path
                                d="M4 17h16"
                            ></path>
                        </svg>

                    </button>


                    <div class="page-heading">

                        <h1
                            class="page-title"
                            id="pageTitle"
                        >
                            Dashboard
                        </h1>

                        <div
                            class="page-subtitle"
                            id="pageSubtitle"
                        >
                            AI-Native Trust Infrastructure
                        </div>

                    </div>

                </div>


                <div
                    class="header-status"
                    data-api-status
                >

                    <span
                        class="status-dot offline"
                    ></span>

                    <span
                        data-api-status-text
                    >
                        Connecting…
                    </span>

                </div>

            </header>



            <!-- ==================================================
                 MAIN CONTENT
                 ================================================== -->

            <main
                class="main-content"
                id="mainContent"
            >

                <!--

                    IMPORTANT

                    main.js renders every application view
                    inside this container.

                    Views:

                    dashboard
                    identities
                    sign
                    verify
                    registry

                -->

                <div
                    id="viewContainer"
                    class="view-container"
                >

                    <!--
                        Initial fallback shown before
                        JavaScript renders Dashboard.
                    -->

                    <section
                        class="view-section"
                    >

                        <article class="card">

                            <span class="eyebrow">
                                AI-NATIVE TRUST
                            </span>

                            <h2>
                                Loading Trust Infrastructure…
                            </h2>

                            <p class="card-description">
                                Initializing digital identity
                                and cryptographic trust services.
                            </p>

                        </article>

                    </section>

                </div>

            </main>

        </div>

    </div>



    <!-- ======================================================
         TOAST CONTAINER
         ====================================================== -->

    <div
        id="toastContainer"
        class="toast-container"
        aria-live="polite"
        aria-atomic="true"
    ></div>



    <!-- ======================================================
         APPLICATION JAVASCRIPT
         ====================================================== -->

    <script src="/main.js"></script>


    <!-- ======================================================
         MOBILE NAVIGATION
         ====================================================== -->

    <script>

        /*
         * Small shell-level mobile navigation.
         *
         * The main application logic remains in main.js.
         * This only controls opening / closing the sidebar.
         */

        document.addEventListener(
            'DOMContentLoaded',
            () => {

                const sidebar =
                    document.getElementById(
                        'sidebar'
                    );

                const menuButton =
                    document.getElementById(
                        'mobileMenuButton'
                    );


                if (
                    !sidebar ||
                    !menuButton
                ) {
                    return;
                }


                menuButton.addEventListener(
                    'click',
                    () => {

                        sidebar.classList.toggle(
                            'open'
                        );

                    }
                );


                document.addEventListener(
                    'click',
                    (event) => {

                        const navItem =
                            event.target.closest(
                                '.nav-item'
                            );

                        if (
                            navItem &&
                            window.innerWidth <= 820
                        ) {

                            sidebar.classList.remove(
                                'open'
                            );

                        }

                    }
                );

            }
        );

    </script>

</body>

</html>
